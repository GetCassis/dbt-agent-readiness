version: 2

models:
  - name: orders
    description: "One row per order, with payment-method amount columns."
    columns:
      - name: order_id
        description: "Order surrogate key."
      # These four are generated by the Jinja for-loop in orders.sql and are
      # present in the manifest's compiled_code. They must NOT be flagged phantom
      # when a compiled manifest is available.
      - name: credit_card_amount
        description: "Amount paid by credit card."
      - name: coupon_amount
        description: "Amount paid by coupon."
      - name: total_amount
        description: "Total order amount."
      # Genuine phantom: declared in YAML but the model never emits it.
      - name: legacy_total
        description: "Deprecated total column; no longer emitted by the SQL."
